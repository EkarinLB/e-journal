# Flatpak manifest for E-Journal (Flathub submission).
#
# App ID: com.ejournal.app — deliberately NOT tied to any individual
# maintainer's account, so the project can be handed to another developer
# without the ID (and therefore the Flathub entry) needing to change.
#
# The build source below points at the current upstream repository. When
# development moves, update this one line to the new canonical URL.
#
# Build locally (clones the tagged source):
#   flatpak-builder --user --install --force-clean build flatpak/com.ejournal.app.yml

app-id: com.ejournal.app
# 25.08 rather than 24.08: the 24.08 SDK ships rustc 1.89, but current Tauri
# 2.12 crates require rustc >= 1.90, so the app would not compile.
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# No `base:`/`base-version:` here. Declaring a base named after the runtime
# makes flatpak-builder search for an *app* ref (app/org.freedesktop.Platform),
# which does not exist, and the build fails with "not installed".
command: e-journal

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.*
  - --filesystem=xdg-documents

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    RUST_BACKTRACE: '1'
    # Tauri's webview needs these at build time on Linux
    LIBSQLITE3_FLAGS: -DSQLITE_ENABLE_FTS5

modules:
  # The Freedesktop SDK ships no Node.js and never will, so one is needed to
  # build the web frontend. Official PREBUILT binaries are used rather than
  # compiling from source: compiling OpenSSL + V8 inside the sandbox took
  # 25-40 minutes per CI run and produced ~3000 lines of compiler output.
  # Only node/npm are kept; the sources and docs are discarded.
  - name: node
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/node /app/bin/node
      - install -d /app/lib/node_modules
      - cp -r lib/node_modules/npm /app/lib/node_modules/npm
      # npm-cli.js requires '../lib/cli.js' relative to itself, so it must
      # stay inside npm's own tree. Copying it to /app/bin fails with
      # MODULE_NOT_FOUND; a shell wrapper loses its arguments because the
      # builder runs commands through a shell that expands "$@" to nothing.
      - chmod +x /app/lib/node_modules/npm/bin/npm-cli.js
      - chmod +x /app/lib/node_modules/npm/bin/npx-cli.js
      - ln -s ../lib/node_modules/npm/bin/npm-cli.js /app/bin/npm
      - ln -s ../lib/node_modules/npm/bin/npx-cli.js /app/bin/npx
      - rm -rf /app/include /app/share /app/lib/node_modules/npm/docs /app/lib/node_modules/npm/test
    sources:
      - type: archive
        url: https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
        sha256: 83bf07dd343002a26211cf1fcd46a9d9534219aad42ee02847816940bf610a72
        strip-components: 1

  - name: e-journal
    buildsystem: simple
    # npm must reach the registry at BUILD time. Without network in the
    # sandbox it fails with EAI_AGAIN, which npm reports as the very
    # misleading "Exit handler never called!".
    build-options:
      build-args:
        - --share=network
    build-commands:
      # Keep npm's cache and config inside /app. Outside it they live under
      # $HOME, which does not exist in the build sandbox, and npm aborts with
      # the unhelpful "Exit handler never called!".
      - export npm_config_cache=/app/.npm-cache
      - export npm_config_update_notifier=false
      - export npm_config_fund=false
      - export npm_config_audit=false
      - npm install --no-audit --no-fund --cache /app/.npm-cache
      # Build the Linux executable only; packaging (.deb) is pointless here.
      - npx tauri build --no-bundle
      # The app binary itself is what Flatpak runs — without this step the
      # bundle would contain desktop files but no executable.
      - install -Dm755 src-tauri/target/release/e-journal /app/bin/e-journal
    sources:
      - type: git
        url: https://github.com/EkarinLB/e-journal.git
        # Flathub builds the released tag; CI can override with
        # --repo=... EJOURNAL_REF=<ref> via flatpak-builder's
        # source-tag override, so master builds do not need an edit here.
        tag: v0.11.0
    post-install:
      - install -Dm644 data/com.ejournal.app.desktop
        /app/share/applications/com.ejournal.app.desktop
      - install -Dm644 data/metainfo/com.ejournal.app.metainfo.xml
        /app/share/metainfo/com.ejournal.app.metainfo.xml
      - install -Dm644 data/icons/128x128/com.ejournal.app.png
        /app/share/icons/hicolor/128x128/apps/com.ejournal.app.png
      - install -Dm644 data/icons/256x256/com.ejournal.app.png
        /app/share/icons/hicolor/256x256/apps/com.ejournal.app.png