# Flatpak manifest for OpenJournal (Flathub submission).
#
# App ID follows Flathub's GitHub reverse-DNS convention:
#   com.github.<owner>.<repo>
# Re-derive the IDs after changing owner with:
#   bash scripts/finalize-flatpak.sh <owner>
#
# Build locally (clones the tagged source):
#   flatpak-builder --user --install --force-clean build flatpak/com.github.EkarinLB.openjournal.yml

app-id: com.github.EkarinLB.openjournal
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.freedesktop.Platform
base-version: '24.08'
command: openjournal

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.*
  - --filesystem=xdg-documents

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/openjournal/cargo
    RUST_BACKTRACE: '1'
    # Tauri's webview needs these at build time on Linux
    LIBSQLITE3_FLAGS: -DSQLITE_ENABLE_FTS5

modules:
  - name: openjournal
    buildsystem: simple
    build-commands:
      - npm install --no-audit --no-fund
      - npx tauri build --bundles deb
    sources:
      - type: git
        url: https://github.com/EkarinLB/openjournal.git
        tag: v0.11.0
    post-install:
      - install -Dm644 data/com.github.EkarinLB.openjournal.desktop
        /app/share/applications/com.github.EkarinLB.openjournal.desktop
      - install -Dm644 data/metainfo/com.github.EkarinLB.openjournal.metainfo.xml
        /app/share/metainfo/com.github.EkarinLB.openjournal.metainfo.xml
      - install -Dm644 data/icons/128x128/com.github.EkarinLB.openjournal.png
        /app/share/icons/hicolor/128x128/apps/com.github.EkarinLB.openjournal.png
      - install -Dm644 data/icons/256x256/com.github.EkarinLB.openjournal.png
        /app/share/icons/hicolor/256x256/apps/com.github.EkarinLB.openjournal.png