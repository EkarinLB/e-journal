# Flatpak manifest for OpenJournal (Flathub submission).
#
# App ID note: Flathub expects GitHub-hosted apps to use reverse-DNS under
# com.github.<owner>.<repo>. This manifest uses com.openjournal.app, which
# requires requesting a custom domain in the Flathub submission form. If you
# prefer the standard path, run scripts/finalize-flatpak.sh once your GitHub
# owner name is known; it rewrites the IDs across every packaging file.
#
# Build locally:
#   flatpak-builder --user --install --force-clean build flatpak/com.openjournal.app.yml

app-id: com.openjournal.app
runtime: org.freedesktop.Platform
Runtime-Version: '24.08'
SDK: org.freedesktop.Sdk
base: org.freedesktop.Platform
base-version: '24.08'
command: openjournal

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.*
  - --filesystem=xdg-documents

# Rust toolchain for the Tauri backend.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/openjournal/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: openjournal
    buildsystem: simple
    build-commands:
      - npm install --offline || npm install
      - npm run tauri-build -- --bundles deb
    sources:
      - type: dir
        path: ..
    post-install:
      - install -Dm644 data/com.openjournal.app.desktop
        /app/share/applications/com.openjournal.app.desktop
      - install -Dm644 data/metainfo/com.openjournal.app.metainfo.xml
        /app/share/metainfo/com.openjournal.app.metainfo.xml
      - install -Dm644 data/icons/128x128/com.openjournal.app.png
        /app/share/icons/hicolor/128x128/apps/com.openjournal.app.png
      - install -Dm644 data/icons/256x256/com.openjournal.app.png
        /app/share/icons/hicolor/256x256/apps/com.openjournal.app.png