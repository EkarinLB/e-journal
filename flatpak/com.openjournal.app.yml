# Flatpak manifest for OpenJournal (Flathub submission).
#
# App ID: com.openjournal.app — deliberately NOT tied to any individual
# maintainer's account, so the project can be handed to another developer
# without the ID (and therefore the Flathub entry) needing to change.
#
# The build source below points at the current upstream repository. When
# development moves, update this one line to the new canonical URL.
#
# Build locally (clones the tagged source):
#   flatpak-builder --user --install --force-clean build flatpak/com.openjournal.app.yml

app-id: com.openjournal.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.freedesktop.Platform
base-version: '24.08'
command: openjournal

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.*
  - --filesystem=xdg-documents

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/openjournal/cargo
    RUST_BACKTRACE: '1'
    # Tauri's webview needs these at build time on Linux
    LIBSQLITE3_FLAGS: -DSQLITE_ENABLE_FTS5

modules:
  - name: openjournal
    buildsystem: simple
    build-commands:
      - npm install --no-audit --no-fund
      - npx tauri build --bundles deb
    sources:
      - type: git
        url: https://github.com/EkarinLB/openjournal.git
        tag: v0.11.0
    post-install:
      - install -Dm644 data/com.openjournal.app.desktop
        /app/share/applications/com.openjournal.app.desktop
      - install -Dm644 data/metainfo/com.openjournal.app.metainfo.xml
        /app/share/metainfo/com.openjournal.app.metainfo.xml
      - install -Dm644 data/icons/128x128/com.openjournal.app.png
        /app/share/icons/hicolor/128x128/apps/com.openjournal.app.png
      - install -Dm644 data/icons/256x256/com.openjournal.app.png
        /app/share/icons/hicolor/256x256/apps/com.openjournal.app.png