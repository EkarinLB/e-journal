<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenJournal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">OpenJournal</div>
    <input id="search" type="search" placeholder="Search notebooks…" aria-label="Search notebooks">
    <div id="notebook-list"></div>
    <button id="add-notebook" class="primary">+ Notebook</button>
    <div class="row">
      <button id="export-btn" title="Export library to .openjournal">Export</button>
      <button id="import-btn" title="Import .openjournal file">Import</button>
    </div>
  </aside>
  <main id="stage">
    <div id="toolbar">
      <div class="tools" role="toolbar" aria-label="Ink tools">
        <button data-tool="pen" class="tool active">Pen</button>
        <button data-tool="highlighter" class="tool">Highlighter</button>
        <button data-tool="eraser" class="tool">Eraser</button>
      </div>
      <div class="colors" id="colors"></div>
      <input id="width" type="range" min="1" max="24" value="3" title="Stroke width">
      <div class="spacer"></div>
      <button id="undo-btn" title="Undo last stroke">Undo</button>
      <button id="clear-btn" title="Clear page">Clear</button>
      <button id="add-page" title="Add page">+ Page</button>
      <button id="del-page" title="Delete page">− Page</button>
      <span id="page-label"></span>
    </div>
    <div id="canvas-wrap"><canvas id="ink"></canvas></div>
  </main>
</div>
<script src="renderer.js"></script>
</body>
</html>
