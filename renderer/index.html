<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenJournal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light">
<div id="app">
  <!-- ============ HOME ============ -->
  <section id="home-view">
    <header id="home-bar">
      <div class="brand">OpenJournal <small id="ver"></small></div>
      <input id="search" type="search" placeholder="Search notebooks…" aria-label="Search notebooks">
      <div class="spacer"></div>
      <button id="import-btn" title="Import .openjournal file">Import</button>
      <button id="import-ink-btn" title="Import Microsoft Journal .ink files (read-only)">Import .ink</button>
      <input id="ink-file" type="file" accept=".ink" multiple hidden>
      <button id="export-btn" title="Export library to .openjournal">Export</button>
      <button id="add-notebook" class="primary">+ New</button>
    </header>
    <div id="nb-grid"></div>
  </section>

  <!-- ============ EDITOR ============ -->
  <section id="editor-view" hidden>
    <div id="topbar">
      <button id="back-btn" title="Back to notebooks">←</button>
      <strong id="nb-name"></strong>
      <div class="spacer"></div>
      <div id="pagedock" role="group" aria-label="Pages">
        <button id="pg-prev" title="Previous page">‹</button>
        <span id="page-indicator"></span>
        <button id="pg-next" title="Next page">›</button>
        <button id="pg-add" title="Add page">+</button>
        <button id="pg-del" title="Delete current page">×</button>
      </div>
      <button id="zoom-out" title="Zoom out (Ctrl+−)">−</button>
      <button id="zoom-label" title="Reset zoom">100%</button>
      <button id="zoom-in" title="Zoom in (Ctrl++)">+</button>
      <button id="zoom-fit" title="Fit width">Fit</button>
      <button id="lines-btn" class="toggle active" title="Ruled lines">Lines</button>
      <button id="theme-btn" title="Toggle light/dark">☾</button>
      <button id="penlog-btn" title="Copy pen event log for diagnostics">Pen log</button>
      <button id="hide-btn" title="Hide interface (H)">Hide UI</button>
    </div>
    <div id="pages"></div>
    <div id="island" role="toolbar" aria-label="Ink tools">
      <button data-tool="pen" class="tool active">Pen</button>
      <button data-tool="pencil" class="tool" title="Pencil">Pencil</button>
      <button data-tool="highlighter" class="tool">Highlighter</button>
      <button data-tool="eraser" class="tool">Eraser</button>
      <button data-tool="select" class="tool" title="Select and move images">Select</button>
      <span class="sep"></span>
      <button id="image-btn" title="Insert image on current page">Image</button>
      <span class="sep"></span>
      <div class="colors" id="colors"></div>
      <input id="width" type="range" min="1" max="24" value="3" title="Stroke width">
      <span class="sep"></span>
      <button id="undo-btn" title="Undo last stroke (Ctrl+Z)">Undo</button>
      <button id="redo-btn" title="Redo (Ctrl+Y)">Redo</button>
      <button id="clear-btn" title="Clear current page">Clear</button>
    </div>
    <button id="show-chrome" hidden title="Show interface (H)">⋯</button>
  </section>

  <div id="toast" hidden></div>
  <div id="modal-backdrop" hidden>
    <div id="modal" role="dialog" aria-modal="true">
      <h3 id="modal-title"></h3>
      <p id="modal-body" hidden></p>
      <input id="modal-input" hidden maxlength="120">
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok" class="primary">OK</button>
      </div>
    </div>
  </div>
</div>
<script src="ink.js"></script>
<script src="../lib/inkfile.js"></script>
<script src="inkImport.js"></script>
<script src="renderer.js"></script>
</body>
</html>
