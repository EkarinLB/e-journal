name: Build native packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Enables the release to create/update the draft release the artifacts attach to.
permissions:
  contents: write

# Never let runs pile up. Without this, every push queues another full
# build and they compete for runners until nothing can start -- which is
# exactly what happened and left the release build queued for 20+ minutes.
# Superseded runs are cancelled automatically; tag builds are left alone.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The native Rust rewrite: the real product. Verified on both target
  # platforms from the first commit, so portability regressions surface in CI
  # rather than on a user's machine.
  native:
    name: Native core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      # `--features headless` skips the windowing module: the logic under test
      # is pure Rust and needs no display.
      - name: Test native core
        run: cargo test --manifest-path native/Cargo.toml --features headless
      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --features headless -- -D warnings
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: JS tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Flatpak packaging is paused while the app is rewritten in native Rust.
  # The current manifest targets a webview-based Tauri build that is being
  # replaced; once the native binary lands, Flatpak becomes simpler again
  # (no Node, no WebKit) and this job is worth re-enabling.
  flatpak:
    name: Flatpak bundle (paused)
    if: false
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build + flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev flatpak flatpak-builder

      - name: Install Freedesktop SDKs
        run: |
          # The SDK must be visible to flatpak-builder, which resolves runtimes
          # from the SYSTEM installation. Installing as the runner user (even
          # with --user) leaves the builder unable to find them, so use sudo.
          sudo flatpak --system remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak --system install -y org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
          # Print what is actually installed: if the build reports a runtime
          # "not installed", this shows whether it really is missing.
          flatpak --system list --runtime

      - name: Cache flatpak-builder
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            flatpak-build
          key: flatpak-${{ runner.os }}-${{ hashFiles('flatpak/com.ejournal.app.yml') }}
          restore-keys: flatpak-${{ runner.os }}-

      - name: Build flatpak
        run: |
          # flatpak-builder takes a build DIRECTORY *and* the manifest:
          #   flatpak-builder [options] DIRECTORY MANIFEST
          # No --disable-download: the manifest pulls sources from git.
          flatpak-builder -y --repo=repo \
            flatpak-build flatpak/com.ejournal.app.yml \
            2>&1 | tee build.log
          # flatpak-builder's exit status is masked by the pipe above.
          test ${PIPESTATUS[0]} -eq 0 || { tail -40 build.log; exit 1; }
          # flatpak-builder exports to the repo's default branch (master),
          # so bundle from master rather than inventing a branch name.
          flatpak build-bundle repo e-journal.flatpak com.ejournal.app master
          ls -la e-journal.flatpak

      - name: Upload flatpak
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: e-journal.flatpak

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: e-journal.flatpak

  build:
    name: Package (${{ matrix.os }})
    needs: test
    permissions:
      # required to create the draft release the artifacts are attached to
      contents: write
    strategy:
      fail-fast: false
      # fedora-latest is a scarce runner label; without this the Fedora job
      # sits queued indefinitely while other jobs hold the account's runner
      # slots. One at a time ensures every job can actually start.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          # Fedora/RHEL family: .rpm for dnf. Built on Fedora because that is
          # where Tauri's rpm bundler and rpmbuild are readily available.
          - os: fedora-latest
            bundles: rpm
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/debian_version ]; then
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
              librsvg2-dev patchelf libssl-dev libgtk-3-dev
          else
            # Fedora / RHEL family: rpm build tooling plus webkit2gtk-4.1.
            sudo dnf install -y webkit2gtk4.1-devel openssl-devel \
              gtk3-devel librsvg2-devel patchelf rpm-build
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag builds attach to the real version tag so the published release
          # carries every artifact. Branch builds upload a workflow artifact
          # instead: creating a draft release per run produced 44 orphaned
          # "build-*" releases that nothing ever attached to.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('E-Journal {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: true
          args: --bundles ${{ matrix.bundles }}

      - name: Upload bundles as a workflow artifact (branch builds only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*.{exe,msi,deb,AppImage,rpm}