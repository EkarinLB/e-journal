name: Build native packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Enables the flatpak job to attach its artifact to a tagged release.
permissions:
  contents: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: JS tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  flatpak:
    name: Flatpak bundle
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build + flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev flatpak flatpak-builder

      - name: Install Freedesktop SDKs
        run: |
          # GitHub runners do not permit flatpak --system operations as the
          # runner user, so everything is installed into the user installation.
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08
          # optional graphics extension; do not fail the build if unavailable
          flatpak --user install -y \
            org.freedesktop.Platform.24.08//extra=//share/extensions/vulkan/ || true

      - name: Build flatpak
        run: |
          # No --disable-download: the manifest pulls sources from git.
          flatpak-builder --user --force-clean --repo=repo \
            flatpak/com.ejournal.app.yml
          flatpak build-bundle repo e-journal.flatpak com.ejournal.app stable

      - name: Upload flatpak
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: e-journal.flatpak

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: e-journal.flatpak

  build:
    name: Package (${{ matrix.os }})
    needs: test
    permissions:
      # required to create the draft release the artifacts are attached to
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: build-${{ matrix.os }}-${{ github.run_number }}
          releaseName: "E-Journal 0.11.0 beta (build ${{ github.run_number }})"
          releaseDraft: true
          prerelease: true
          args: --bundles ${{ matrix.bundles }}