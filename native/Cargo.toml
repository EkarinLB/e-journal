[package]
name = "ejournal"
version = "0.12.0"
edition = "2021"
description = "Local-first ink notebook — native, no webview"

# Phase 1: pure-Rust core, zero dependencies beyond serde.
# Geometry, model and storage are ported from renderer/ink.js, lib/model.js
# and src-tauri/src/main.rs. Windowing and rasterisation land in phase 2.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 2: the native shell. winit gives us the window and raw pen input
# (pressure, palm rejection) without a webview; tiny-skia rasterises to the
# window. Together they remove the browser engine entirely.
winit = "0.30"
tiny-skia = "0.11"
# CPU blit into the window. winit has no software present path of its own,
# so this is what puts rasterised pixels on screen without a GPU driver.
softbuffer = "0.4"

# Windows pen input. WM_POINTER_* carries true stylus pressure and identifies
# pen vs touch, which winit 0.30 no longer exposes. Linux uses libinput
# instead; see src/pen/mod.rs for the shared policy both feed.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # WM_POINTER_* and the POINTER_* structs live here.
    "Win32_UI_Input_Pointer",
    "Win32_System_LibraryLoader",
] }

[features]
default = []
# Tests skip the windowing module; the logic under test is all pure Rust.
headless = []
# The window, input loop and presentation layer. Off by default so the core
# can be tested and cross-checked on CI without a display.
window = []

[target.x86_64-pc-windows-msvc.dependencies]
