[package]
name = "ejournal"
version = "0.12.0"
edition = "2021"
description = "Local-first ink notebook — native, no webview"

# The core is pure Rust: geometry, model and storage ported from
# renderer/ink.js, lib/model.js and src-tauri/src/main.rs. It has no
# dependencies beyond serde, so it builds and tests anywhere, on CI or
# offline, with no system libraries to install.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# Text rendering for the native UI (buttons, labels, settings). Pure Rust.
ab_glyph = "0.2"

# Windows pen input. WM_POINTER_* carries true stylus pressure and identifies
# pen vs touch, which winit 0.30 no longer exposes. Linux uses libinput
# instead; see src/pen/mod.rs for the shared policy both feed.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # WM_POINTER_* and the POINTER_* structs live here.
    "Win32_UI_Input_Pointer",
    "Win32_System_LibraryLoader",
] }

# The windowing stack is optional. It pulls in platform libraries (X11 /
# Wayland / GTK headers on Linux), which would otherwise be required just to
# compile the core — and made the Linux CI job fail for want of them.
[dependencies.winit]
version = "0.30"
optional = true

[dependencies.tiny-skia]
version = "0.11"

# CPU blit into the window. winit has no software present path of its own,
# so this is what puts rasterised pixels on screen without a GPU driver.
[dependencies.softbuffer]
version = "0.4"
optional = true

[features]
default = []
# Tests skip the windowing module; the logic under test is all pure Rust.
headless = []
# The window, input loop and presentation layer. Off by default so the core
# can be tested and cross-checked on CI without a display or system libraries.
# tiny-skia stays unconditional: the page renderer is core logic, and it is
# pure Rust with no system dependencies.
window = ["dep:winit", "dep:softbuffer"]

[[bin]]
name = "ejournal"
path = "src/main.rs"

[profile.release]
# Ink rendering is fill-rate bound; these cut both build time and binary size
# without measurable frame-time cost.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true