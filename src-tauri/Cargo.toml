[package]
name = "E-Journal"
# Must stay in step with package.json and tauri.conf.json. When it drifted, the
# .deb advertised 0.12.0 while the binary it shipped reported 0.11.0.
version = "0.12.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.11", features = ["blocking", "json"] }
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
